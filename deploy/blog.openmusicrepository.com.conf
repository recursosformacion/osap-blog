# OSAP Blog - blog.openmusicrepository.com
# nginx -> uvicorn 127.0.0.1:8500 (servicio osap-blog)
# Certificado esperado en /etc/letsencrypt/live/blog.openmusicrepository.com/.

server {
    listen 80;
    listen [::]:80;
    server_name blog.openmusicrepository.com;

    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.openmusicrepository.com;

    ssl_certificate /etc/letsencrypt/live/blog.openmusicrepository.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.openmusicrepository.com/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }
}
