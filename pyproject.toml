[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osap-blog"
version = "1.0.5"
description = "Blog independiente de OpenMusicRepository (OSAP)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pymysql>=1.1,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools]
py-modules = ["app"]





